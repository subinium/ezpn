name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_call:

jobs:
  audit:
    runs-on: ubuntu-latest
    # `checks: write` lets rustsec/audit-check publish a check run.
    # Without this, the action falls back to a hard error on push events.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      # Install the released binary before audit-check can try an unlocked
      # source build whose transitive dependencies may require a newer Rust.
      - uses: taiki-e/install-action@cargo-audit
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail on new unsound, unmaintained or yanked warnings
        run: cargo audit --deny warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
