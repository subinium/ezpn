name: Bench regression

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  protocol-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 33959811188
          name: criterion-evidence
          path: target/control-input
      - name: Identical-executable A/A controls, no gate replacement
        run: python3 scripts/protocol-control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-identical-executable-control
          path: target/protocol-control/
          if-no-files-found: error
          retention-days: 14
