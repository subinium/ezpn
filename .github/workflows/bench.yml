name: Bench regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Compare complete revisions, fail on missing estimates
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
            base="$PUSH_BASE"
          else
            base=$(git describe --tags --abbrev=0 HEAD^)
          fi
          python3 scripts/bench-regression.py --base "$base" \
            --out "target/bench-evidence/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-evidence
          path: |
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/base.txt
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/protocol-codec-*
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/raw/**
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/analysis/**
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/executables/**
            target/bench-evidence/${{ github.run_id }}-${{ github.run_attempt }}/criterion-current/**
          if-no-files-found: error
          retention-days: 14

  soak-smoke:
    name: soak-smoke (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Build the labeled release artifact
        env:
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          if [ "$BUILD_FEATURES" = all-features ]; then
            cargo build --locked --release --bins --all-features
          else
            cargo build --locked --release --bins
          fi
      - name: Real 30-minute workload, no failure suppression
        run: bash tests/soak/run.sh --profile=smoke --out=target/soak-smoke-${{ matrix.features }} --build-features=${{ matrix.features }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-smoke-${{ matrix.features }}
          path: target/soak-smoke-${{ matrix.features }}/
          if-no-files-found: error
          retention-days: 30
