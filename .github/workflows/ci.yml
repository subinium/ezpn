name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  PROPTEST_CASES: "128"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ssh: required
          - os: macos-15
            ssh: optional
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install real SSH prerequisites on the ephemeral Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Install declared MSRV
        run: |
          msrv=$(cargo metadata --locked --format-version=1 --no-deps | python3 -c 'import json,sys; print(next(p["rust_version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ezpn"))')
          rustup toolchain install "$msrv" --profile minimal
      - name: Locked default and all-feature gates, real PTY tests
        run: python3 scripts/preflight.py --ssh ${{ matrix.ssh }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ matrix.os }}
          path: target/preflight/
          if-no-files-found: error
