name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source line coverage, strict overall and module floors
        run: bash scripts/coverage.sh

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov.info
            coverage.json
          retention-days: 14


  fuzz-smoke:
    # Issue #94 acceptance: fuzz target runs 10 minutes per PR and uploads
    # crashes as artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # cargo-fuzz does not expose --locked. Check the real target manifest
      # with Cargo first, then reject any lockfile edits from the fuzz runs.
      - name: Check locked fuzz targets
        run: cargo +nightly check --locked --manifest-path fuzz/Cargo.toml

      - name: Fuzz protocol_decode (10 min)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run protocol_decode -- -max_total_time=600 -timeout=10

      - name: Fuzz snapshot_decode (5 min)
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run snapshot_decode -- -max_total_time=300 -timeout=10

      - name: Verify fuzz dependency lock did not change
        if: always()
        run: git diff --exit-code -- fuzz/Cargo.lock

      - name: Upload fuzz crash corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
