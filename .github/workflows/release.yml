name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  coverage:
    uses: ./.github/workflows/coverage.yml
  performance:
    uses: ./.github/workflows/bench.yml
  secret-scan:
    uses: ./.github/workflows/gitleaks.yml
    secrets: inherit
  supply-chain:
    permissions:
      contents: read
      checks: write
      issues: write
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit

  build:
    needs: [ci, coverage, performance, supply-chain, secret-scan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo metadata --locked --format-version=1 --no-deps | python3 -c 'import json,os,sys; p=next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "ezpn"); assert os.environ["TAG"] == "v" + p["version"]'
      - name: Native release-mode tests including real PTYs
        run: |
          set -euo pipefail
          bash scripts/isolated.sh cargo test --locked --release --all-features --target '${{ matrix.target }}' 2>&1 | tee release-tests.log
          python3 scripts/check-evidence.py tests release-tests.log
      - run: cargo build --locked --release --bins --target '${{ matrix.target }}'
      - name: Package both executables and smoke the extracted artifacts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -czf "ezpn-${TARGET}.tar.gz" -C "target/${TARGET}/release" ezpn ezpn-ctl
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          tar -xzf "ezpn-${TARGET}.tar.gz" -C "$scratch"
          env -i HOME="$scratch" PATH=/usr/bin:/bin "$scratch/ezpn" --version
          env -i HOME="$scratch" PATH=/usr/bin:/bin "$scratch/ezpn-ctl" --help
          shasum -a 256 "ezpn-${TARGET}.tar.gz" > "ezpn-${TARGET}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ezpn-${{ matrix.target }}
          path: |
            ezpn-${{ matrix.target }}.tar.gz
            ezpn-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-tests-${{ matrix.target }}
          path: release-tests.log

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ezpn-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete binary matrix and checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -s "ezpn-${target}.tar.gz"
            sha256sum -c "ezpn-${target}.tar.gz.sha256"
          done
      - name: Verify publishable crate before creating release
        run: cargo package --locked
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.tar.gz artifacts/*.sha256 --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes artifacts/*.tar.gz artifacts/*.sha256
          fi
      - name: Publish locked crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
